name: FreeEdit checks

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python-and-ffmpeg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and lightweight test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.110,<1" "pydantic>=2.6,<3" "uvicorn>=0.29,<1" "httpx>=0.27,<1"
      - name: Compile Python
        run: python -m compileall -q backend tests
      - name: Run Python integration and session tests
        run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          for file in frontend/*.js; do node --check "$file"; done
      - name: Run frontend regression tests
        run: node --test tests/*.cjs

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser, FFmpeg and app dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install "fastapi>=0.110,<1" "pydantic>=2.6,<3" "uvicorn>=0.29,<1"
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Generate synthetic sample and start editor
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=320x180:rate=24:duration=4" -c:v libx264 -preset ultrafast -threads 1 /tmp/freeedit-ci-sample.mp4
          uvicorn backend.app:app --host 127.0.0.1 --port 8765 > /tmp/freeedit-browser-server.log 2>&1 &
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8765/healthz; then exit 0; fi
            sleep 1
          done
          cat /tmp/freeedit-browser-server.log
          exit 1
      - name: Upload, reframe, select and export in Chromium
        run: node tests/browser_smoke.mjs
      - name: Server diagnostics on failure
        if: failure()
        run: cat /tmp/freeedit-browser-server.log
