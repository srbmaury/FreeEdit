services:
  - type: web
    name: freeedit
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    domains:
      - freeedit.srbmaury.com
    envVars:
      - key: MAX_UPLOAD_MB
        value: "100"
      - key: MAX_DURATION_MIN
        value: "10"
      - key: JOB_TTL_HOURS
        value: "1"
      - key: FREEEDIT_MAX_ACTIVE_UPLOADS
        value: "2"
      - key: FREEEDIT_SECURE_COOKIES
        value: "true"
      - key: FREEEDIT_UPLOADS_PER_SESSION_10M
        value: "8"
      - key: FREEEDIT_OPERATIONS_PER_SESSION_10M
        value: "20"
